<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive image activity for WDD 131.">
    <meta name="author" content="Prosper Chidike Nwogu">

    <title>WDD 131 | Responsive Images</title>

    <link rel="stylesheet" href="styles/responsive-images.css">
</head>

<body>
    <header>
        <h1>Responsive Images</h1>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source
                    srcset="images/hero-large.webp"
                    media="(min-width: 1000px)">

                <source
                    srcset="images/hero-medium.webp"
                    media="(min-width: 500px)">

                <img
                    src="images/hero-small.webp"
                    alt="A beautiful view of the selected temple"
                    width="1500"
                    height="750">
            </picture>
        </div>
    </main>

    <footer>
        <p>WDD 131 | Dynamic Web Fundamentals</p>
    </footer>
</body>
</html>
