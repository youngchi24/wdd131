<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A lazy loading activity demonstrating how images load as users scroll down a webpage.">
    <meta name="author" content="Prosper Chidike Nwogu">

    <title>Lazy Loading Activity | WDD 131</title>

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <header>
        <h1>Lazy Loading Images</h1>
    </header>

    <main>
        <h1>Beautiful Nature Images</h1>

        <img
            src="https://picsum.photos/seed/nature1/400/600"
            alt="A beautiful nature scene"
            width="400"
            height="600"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/nature2/400/600"
            alt="A scenic landscape"
            width="400"
            height="600"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/nature3/400/600"
            alt="A beautiful outdoor environment"
            width="400"
            height="600"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/nature4/400/600"
            alt="A peaceful natural environment"
            width="400"
            height="600"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/nature5/400/600"
            alt="A scenic view of nature"
            width="400"
            height="600"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/nature6/400/600"
            alt="A beautiful landscape surrounded by nature"
            width="400"
            height="600"
            loading="lazy">
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Prosper Chidike Nwogu</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
